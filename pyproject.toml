[project]
name = "f1-pitwall"
version = "0.1.0"
description = "Animated Formula 1 telemetry dashboard (FastF1 + Streamlit + Plotly)."
requires-python = ">=3.11"

[tool.black]
line-length = 88
target-version = ["py311"]

[tool.ruff]
line-length = 88
target-version = "py311"

[tool.ruff.lint]
# Pyflakes + pycodestyle + import sorting. We intentionally keep the default-ish
# set: Plotly-heavy code relies on dict() literals and the app needs a sys.path
# shim before imports, so we do not enable C408/E402-style rules project-wide.
select = ["E", "F", "I", "W"]

[tool.ruff.lint.per-file-ignores]
# ``app.py`` inserts ``src`` onto sys.path before importing the packages.
"src/app.py" = ["E402"]
"tests/*" = ["E402"]

[tool.pytest.ini_options]
testpaths = ["tests"]
